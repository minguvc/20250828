<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>빈 강의실의 세 가지 목소리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 장씩 넘기는 종이 기록장 — 좁은 단일 칼럼, 상단 진행 단계, 장면마다 작은 선화 아이콘 */
:root {
  --paper: #F5F0E4;
  --card: #FCF9F2;
  --ink: #1E2738;
  --ink-soft: #545C6B;
  --line: #DCD2BE;
  --navy: #24375E;
  --sage: #557259;
  --terra: #A85A3B;
  --gold: #A9822F;
  --on-accent: #FCF9F2;
  --grain: rgba(80, 60, 30, .035);
  --font-display: "Nanum Myeongjo", "Noto Serif KR", "AppleMyungjo", serif;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #141A24; --card: #1C2330; --ink: #ECE6D8; --ink-soft: #B2AEA3; --line: #323B4B;
    --navy: #93ABD9; --sage: #9EBC9F; --terra: #DF9877; --gold: #D8B562; --on-accent: #141A24;
    --grain: rgba(255, 240, 210, .025); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #141A24; --card: #1C2330; --ink: #ECE6D8; --ink-soft: #B2AEA3; --line: #323B4B;
  --navy: #93ABD9; --sage: #9EBC9F; --terra: #DF9877; --gold: #D8B562; --on-accent: #141A24;
  --grain: rgba(255, 240, 210, .025); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body {
  background-color: var(--paper);
  background-image:
    repeating-linear-gradient(0deg, var(--grain) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, var(--grain) 0 1px, transparent 1px 4px);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 17px;
  line-height: 1.75;
  word-break: keep-all;
  overflow-wrap: anywhere;
}
#root { min-height: 100vh; }
.wrap {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; text-wrap: balance; line-height: 1.35; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; border-radius: 6px; }
h2:focus, h1:focus { outline: none; }

/* ---------- 상단 ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.top-inner {
  max-width: 720px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 10px;
}
.brand { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--navy); }
.badge { font-size: 12px; letter-spacing: .04em; padding: 2px 10px; border: 1px solid var(--gold); color: var(--gold); border-radius: 999px; }
.steps { list-style: none; margin: 8px 0 0; padding: 0; display: flex; gap: 4px; }
.steps li { flex: 1 1 0; min-width: 0; }
.steps .bar { height: 4px; border-radius: 2px; background: var(--line); }
.steps li.done .bar { background: var(--navy); opacity: .45; }
.steps li.now .bar { background: var(--navy); }
.steps .lbl { display: block; font-size: 12.5px; color: var(--ink-soft); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps li.now .lbl { color: var(--ink); font-weight: 600; }
.steps .arrow { color: var(--line); }
@media (max-width: 520px) {
  .steps .lbl { font-size: 11px; white-space: normal; line-height: 1.3; }
}

/* ---------- 화면 공통 ---------- */
.screen { padding-top: 36px; display: flex; flex-direction: column; gap: 24px; animation: fade .5s ease both; }
@keyframes fade { from { opacity: .001; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .screen, .reveal { animation: none !important; } }
.eyebrow { font-size: 13px; letter-spacing: .08em; color: var(--ink-soft); font-weight: 600; }
.lede { font-size: 18.5px; line-height: 1.85; }
.muted { color: var(--ink-soft); }
.small { font-size: 15px; }
.icon { width: 44px; height: 44px; color: var(--navy); flex: none; }
.icon svg { width: 100%; height: 100%; }
.headrow { display: flex; gap: 14px; align-items: center; }
.headrow > div { min-width: 0; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px; }
.note { border-left: 3px solid var(--gold); padding: 4px 0 4px 16px; color: var(--ink-soft); font-size: 15.5px; }

/* ---------- 버튼 ---------- */
.actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: space-between; align-items: center; }
.actions .spacer { flex: 1; }
.btn {
  font: inherit; font-weight: 600; font-size: 17px;
  min-height: 52px; padding: 12px 26px; border-radius: 8px;
  border: 1.5px solid var(--navy); background: var(--navy); color: var(--on-accent);
  cursor: pointer; transition: transform .15s ease, opacity .15s ease;
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:disabled { opacity: .35; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--navy); }
.btn.big { font-size: 18.5px; padding: 14px 32px; }

/* ---------- 선택지 카드 ---------- */
.options { display: flex; flex-direction: column; gap: 12px; border: 0; padding: 0; margin: 0; min-width: 0; }
.options legend { padding: 0; margin-bottom: 14px; font-family: var(--font-display); font-weight: 700; font-size: 21px; line-height: 1.5; text-wrap: balance; }
.opt { position: relative; display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; min-height: 60px; background: var(--card); border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; transition: border-color .15s, background .15s; }
.opt:hover { border-color: var(--ink-soft); }
.opt input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.opt .key { flex: none; width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 600; font-size: 15px; color: var(--ink-soft); margin-top: 1px; }
.opt .txt { min-width: 0; font-size: 17px; }
.opt:has(input:checked) { border-color: var(--navy); background: color-mix(in srgb, var(--navy) 7%, var(--card)); }
.opt:has(input:checked) .key { background: var(--navy); border-color: var(--navy); color: var(--on-accent); }
.opt:has(input:focus-visible) { outline: 3px solid var(--gold); outline-offset: 3px; }

.counter { font-variant-numeric: tabular-nums; font-weight: 600; color: var(--navy); font-size: 15px; }
.qbar { height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.qbar span { display: block; height: 100%; background: var(--gold); transition: width .3s ease; }

/* ---------- 역할 ---------- */
.role { --rc: var(--navy); }
.role-life { --rc: var(--navy); }
.role-link { --rc: var(--sage); }
.role-delib { --rc: var(--terra); }
.rolecard { border: 1.5px solid var(--rc); border-radius: 12px; background: var(--card); overflow: hidden; }
.rolecard .rhead { background: color-mix(in srgb, var(--rc) 12%, var(--card)); padding: 22px 22px 18px; border-bottom: 1px solid color-mix(in srgb, var(--rc) 30%, transparent); }
.rolecard .rname { font-family: var(--font-display); font-weight: 800; font-size: 28px; color: var(--rc); }
.rolecard .rq { font-family: var(--font-display); font-size: 19px; font-weight: 700; margin-top: 6px; }
.rolecard .rbody { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.kv { display: grid; grid-template-columns: 6.5em 1fr; gap: 4px 12px; }
.kv dt { font-size: 14px; color: var(--ink-soft); font-weight: 600; padding-top: 2px; }
.kv dd { margin: 0; min-width: 0; }
@media (max-width: 460px) { .kv { grid-template-columns: 1fr; } .kv dd { margin-bottom: 8px; } }
.scores { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.score { padding: 12px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); min-width: 0; }
.score .n { font-variant-numeric: tabular-nums; font-size: 22px; font-weight: 600; color: var(--rc); }
.score .l { font-size: 13.5px; color: var(--ink-soft); }
.dots { display: flex; gap: 3px; margin-top: 6px; flex-wrap: wrap; }
.dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
.dots i.on { background: var(--rc); }
@media (max-width: 460px) { .scores { grid-template-columns: 1fr; } }
.tie-pick .opt:has(input:checked) { border-color: var(--rc); background: color-mix(in srgb, var(--rc) 8%, var(--card)); }
.tie-pick .opt:has(input:checked) .key { background: var(--rc); border-color: var(--rc); }

.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; padding: 3px 12px; border-radius: 999px; color: var(--rc); border: 1px solid color-mix(in srgb, var(--rc) 50%, transparent); background: color-mix(in srgb, var(--rc) 8%, transparent); }
.summary { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; padding: 14px 18px; border: 1px dashed var(--line); border-radius: 10px; font-size: 15px; }
.summary b { font-weight: 600; }

/* ---------- 장면 ---------- */
.block { display: flex; flex-direction: column; gap: 10px; }
.blabel { display: flex; align-items: center; gap: 8px; font-size: 13px; letter-spacing: .08em; font-weight: 600; color: var(--ink-soft); }
.blabel::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.narr { font-family: var(--font-display); font-size: 20px; line-height: 1.9; }
.voice { display: flex; gap: 12px; align-items: flex-start; }
.voice .icon { width: 30px; height: 30px; color: var(--ink-soft); margin-top: 4px; }
.voice blockquote { margin: 0; min-width: 0; }
.voice blockquote p { font-size: 17.5px; }
.voice cite { display: block; font-style: normal; font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
.voices { display: flex; flex-direction: column; gap: 16px; }
.lens { padding: 12px 16px; border-radius: 8px; background: color-mix(in srgb, var(--rc) 9%, transparent); font-size: 15.5px; }
.lens b { color: var(--rc); font-weight: 600; }
.reveal { animation: fade .45s ease both; }
.feedback { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.feedback .card { padding: 16px 18px; }
.feedback h3 { font-family: var(--font-body); font-size: 13.5px; letter-spacing: .06em; font-weight: 600; color: var(--ink-soft); margin-bottom: 4px; }
.feedback .card.val { border-top: 3px solid var(--sage); }
.feedback .card.que { border-top: 3px solid var(--gold); }
@media (max-width: 560px) { .feedback { grid-template-columns: 1fr; } }
.common { font-family: var(--font-display); font-size: 18px; font-weight: 700; line-height: 1.75; color: var(--navy); padding: 6px 0 0; }
.path { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.path li { display: grid; grid-template-columns: 5.5em 1fr; gap: 10px; font-size: 15.5px; }
.path li span:first-child { color: var(--ink-soft); }
.path li span { min-width: 0; }

/* ---------- 제안서 ---------- */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-weight: 600; font-size: 16px; }
.field textarea { font: inherit; font-size: 16.5px; line-height: 1.7; color: var(--ink); background: var(--card); border: 1.5px solid var(--line); border-radius: 8px; padding: 12px 14px; min-height: 92px; resize: vertical; width: 100%; }
.field textarea:focus { border-color: var(--navy); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 45%, transparent); }
.doc { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 30px 28px; box-shadow: 0 1px 0 var(--line), 0 10px 26px -18px rgba(0,0,0,.35); position: relative; }
.doc::before { content: ""; position: absolute; inset: 8px; border: 1px solid var(--line); pointer-events: none; border-radius: 2px; }
.doc-head { text-align: center; display: flex; flex-direction: column; gap: 4px; padding-bottom: 16px; border-bottom: 2px solid var(--navy); }
.doc-head h3 { font-size: 26px; color: var(--navy); letter-spacing: .1em; }
.doc-head .meta { font-size: 13.5px; color: var(--ink-soft); }
.doc dl { margin: 18px 0 0; display: flex; flex-direction: column; gap: 14px; }
.doc dt { font-size: 13.5px; font-weight: 600; color: var(--gold); letter-spacing: .04em; }
.doc dd { margin: 2px 0 0; white-space: pre-wrap; font-size: 16.5px; }
.doc dd.empty { color: var(--ink-soft); font-style: italic; }
.doc-foot { margin-top: 20px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13.5px; color: var(--ink-soft); display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
@media (max-width: 460px) { .doc { padding: 24px 18px; } }

/* ---------- 돌아보기 ---------- */
.compare { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; }
.compare .card { text-align: center; padding: 18px; }
.compare .card .k { font-size: 13.5px; color: var(--ink-soft); font-weight: 600; letter-spacing: .06em; }
.compare .card .v { font-family: var(--font-display); font-weight: 800; font-size: 20px; margin-top: 6px; }
.compare .arr { align-self: center; color: var(--gold); font-size: 22px; }
@media (max-width: 520px) { .compare { grid-template-columns: 1fr; } .compare .arr { transform: rotate(90deg); justify-self: center; } }
.verdict { text-align: center; font-family: var(--font-display); font-size: 19px; font-weight: 700; color: var(--navy); }
.principles { display: flex; flex-direction: column; gap: 0; }
.principle { display: grid; grid-template-columns: 9em 1fr; gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
.principle:first-of-type { border-top: 0; }
.principle h3 { font-size: 17px; color: var(--navy); }
.principle p { min-width: 0; }
@media (max-width: 520px) { .principle { grid-template-columns: 1fr; gap: 2px; } }
.closing { font-family: var(--font-display); font-size: 21px; line-height: 1.9; font-weight: 700; text-align: center; padding: 28px 8px; border-block: 1px solid var(--line); }

/* ---------- 첫 화면 ---------- */
.hero { padding-top: 28px; display: flex; flex-direction: column; gap: 22px; }
.hero .icon { width: 64px; height: 64px; }
.hero h1 { font-size: clamp(32px, 7vw, 46px); color: var(--navy); }
.hero .sub { font-family: var(--font-display); font-size: clamp(18px, 3.6vw, 22px); font-weight: 700; color: var(--ink-soft); margin-top: 8px; }
.trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.trio > div { border-top: 3px solid var(--rc); padding-top: 10px; font-size: 15px; min-width: 0; }
.trio b { display: block; font-family: var(--font-display); color: var(--rc); font-size: 16.5px; }
@media (max-width: 460px) { .trio { grid-template-columns: 1fr; } }

/* ---------- 진행자 메모 ---------- */
.pnote { margin-top: 36px; border: 1px dashed var(--gold); border-radius: 8px; background: color-mix(in srgb, var(--gold) 6%, transparent); font-size: 15px; }
.pnote summary { cursor: pointer; padding: 10px 14px; font-weight: 600; color: var(--gold); list-style: none; display: flex; justify-content: space-between; gap: 8px; }
.pnote summary::-webkit-details-marker { display: none; }
.pnote summary::after { content: "열기 ▾"; font-weight: 500; font-size: 13px; }
.pnote[open] summary::after { content: "접기 ▴"; }
.pnote .pbody { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 6px; }
.pnote .time { font-variant-numeric: tabular-nums; font-weight: 600; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

</head>
<body>
<div id="root"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/htm@3.1.1/dist/htm.umd.js"></script>
<script>
(function () {
const { useState, useEffect, useRef, useMemo } = React;
const html = htm.bind(React.createElement);

/* =================== 데이터 =================== */
const ROLE_KEYS = ["life", "link", "delib"];
const ROLES = {
  life: { name: "생활권 시민", q: "“그래서 누가, 얼마나 편해지는가?”", desc: "당신은 정책이 사람들의 실제 일상에 어떤 변화를 만드는지 먼저 살핍니다.", view: "“학생들이 가장 자주 쓰는 자습실이 필요해.”" },
  link: { name: "연결 시민", q: "“이 결정에 빠진 목소리는 없는가?”", desc: "당신은 결정에서 소외되는 사람이 없는지, 관계와 돌봄이 살아 있는지를 먼저 살핍니다.", view: "“학생과 지역주민이 함께 만나는 공간이 필요해.”" },
  delib: { name: "숙의 시민", q: "“이 결정은 근거 있고 공정한가?”", desc: "당신은 충분한 정보와 공정한 절차가 있는지를 먼저 살핍니다.", view: "“먼저 수요와 예산을 확인하고 공정하게 결정해야 해.”" }
};

const QUESTIONS = [
  { q: "빈 강의실을 발견했을 때 가장 먼저 드는 생각은?", o: ["시험기간에 공부할 조용한 공간이 더 필요하다.", "혼자 쉬거나 사람들과 편하게 머무를 공간이 있으면 좋겠다.", "현재 공간이 얼마나 부족한지 먼저 조사해야겠다."] },
  { q: "중앙대학교 시설을 바꿀 때 가장 중요하다고 생각하는 기준은?", o: ["실제 이용자가 얼마나 자주, 편하게 사용할 수 있는가", "다양한 사람을 배제하지 않고 함께 사용할 수 있는가", "예산과 절차가 투명하고 공정한가"] },
  { q: "친구가 “그냥 온라인 투표로 빨리 정하자”고 말한다면?", o: ["많은 학생이 참여할 수 있다면 괜찮다고 생각한다.", "온라인 투표에 참여하기 어려운 사람도 있을 수 있어 걱정된다.", "투표 전에 선택지와 근거가 충분히 제공되어야 한다고 생각한다."] },

  proposal: { a: "", b: "", c: "", d: "" }, finalOpinion: null
});
function load() {
  try { const s = JSON.parse(sessionStorage.getItem(KEY)); if (s && s.stage) return Object.assign(fresh(), s); } catch (e) {}
  return fresh();
}
function computeScores(answers) {
  const s = { life: 0, link: 0, delib: 0 };
  answers.forEach(a => { if (a !== null) s[ROLE_KEYS[a]] += 1; });
  return s;
}
function topRoles(scores) {
  const max = Math.max(scores.life, scores.link, scores.delib);
  return ROLE_KEYS.filter(k => scores[k] === max);
}
function isPresenter() {
  try {
    const p = new URLSearchParams(location.search).get("presenter");
    if (p === "true") return true;
    return /(^#|&)presenter(=true)?($|&)/.test(location.hash);
  } catch (e) { return false; }
}

/* =================== 공용 컴포넌트 =================== */
function Options({ name, legend, items, value, onChange, keys }) {
  return html`<fieldset class="options">
    ${legend ? html`<legend>${legend}</legend>` : null}
    ${items.map((t, i) => html`
      <label class="opt" key=${i}>
        <input type="radio" id=${name + "-" + i} name=${name} checked=${value === i} onChange=${() => onChange(i)} />
        <span class="key" aria-hidden="true">${keys ? keys[i] : String.fromCharCode(65 + i)}</span>
        <span class="txt">${t}</span>
      </label>`)}
  </fieldset>`;
}
function PresenterNote({ id, on }) {
  if (!on || !NOTES[id]) return null;
  const [time, text] = NOTES[id];
  return html`<details class="pnote" key=${id}>
    <summary>진행자 메모</summary>
    <div class="pbody"><span class="time">예상 진행 시간 · ${time}</span><p>${text}</p></div>
  </details>`;
}
function Title({ children, level }) {
  const Tag = level === 1 ? "h1" : "h2";
  return html`<${Tag} id="screen-title" tabIndex="-1">${children}<//>`;
}
function RoleChip({ role }) {
  if (!role) return null;
  return html`<span class=${"chip role role-" + role}>${ROLES[role].name}</span>`;
}

/* =================== 화면 =================== */
function Intro({ go }) {
  return html`<section class="hero screen">
    <${Icon} name="board" />
    <div>
      <${Title} level=${1}>빈 강의실의 세 가지 목소리<//>
      <p class="sub">우리는 무엇을 기준으로 함께 결정할까?</p>
    </div>
    <p class="lede">중앙대학교 캠퍼스의 빈 강의실 하나. 누군가는 조용한 자습실을, 누군가는 학생 휴게공간을, 또 다른 누군가는 지역과 함께 쓰는 문화공간을 원합니다. 중앙대의 이 공간은 누구를 위해, 어떻게 활용되어야 할까요?</p>
    <div class="trio">
      <div class="role role-life"><b>생활권 시민</b>일상의 변화를 먼저 봅니다</div>
      <div class="role role-link"><b>연결 시민</b>빠진 목소리를 먼저 봅니다</div>
      <div class="role role-delib"><b>숙의 시민</b>근거와 절차를 먼저 봅니다</div>
    </div>
    <div class="actions"><button class="btn big" onClick=${go}>시민 성향 알아보기</button></div>
    <p class="note">이 검사는 정답을 찾는 검사가 아닙니다. 내가 어떤 가치를 먼저 살피는지 알아보는 활동입니다.</p>
    <p class="small muted">이 활동은 중앙대학교 학생·교직원·인근 지역주민이 함께 논의하는 가상 상황입니다. 특정 캠퍼스나 실제 건물을 가리키지 않습니다.</p>
  </section>`;
}

function Survey({ s, set }) {
  const i = s.qIndex, Q = QUESTIONS[i], val = s.answers[i];
  const choose = (k) => { const a = s.answers.slice(); a[i] = k; set({ answers: a }); };
  const next = () => {
    if (val === null) return;
    if (i < 8) set({ qIndex: i + 1 });
    else {
      const tops = topRoles(computeScores(s.answers));
      set({ stage: "role", chosenRole: tops.length === 1 ? tops[0] : (tops.includes(s.chosenRole) ? s.chosenRole : null) });
    }
  };
  return html`<section class="screen" key=${"q" + i}>
    <div class="headrow">
      <${Icon} name="compass" />
      <div><p class="eyebrow">1단계 · 시민 성향 설문</p><p class="counter" aria-live="polite">${i + 1} / 9</p></div>
    </div>
    <div class="qbar" aria-hidden="true"><span style=${{ width: ((i + 1) / 9 * 100) + "%" }}></span></div>
    <h2 class="sr" id="screen-title" tabIndex="-1">질문 ${i + 1}. ${Q.q}</h2>
    <${Options} name=${"q" + i} legend=${"Q" + (i + 1) + ". " + Q.q} items=${Q.o} value=${val} onChange=${choose} />
    <div class="actions">
      ${i > 0 ? html`<button class="btn ghost" onClick=${() => set({ qIndex: i - 1 })}>이전 질문</button>` : html`<span></span>`}
      <button class="btn" disabled=${val === null} onClick=${next}>${i < 8 ? "다음 질문" : "나의 역할 보기"}</button>
    </div>
    ${val === null ? html`<p class="small muted">답을 하나 고르면 다음으로 넘어갈 수 있습니다.</p>` : null}
  </section>`;
}

function RoleCard({ role }) {
  const R = ROLES[role];
  return html`<article class=${"rolecard role role-" + role}>
    <div class="rhead"><div class="rname">${R.name}</div><p class="rq">${R.q}</p></div>
    <div class="rbody">
      <dl class="kv">
        <dt>설명</dt><dd>${R.desc}</dd>
        <dt>시작 관점</dt><dd>${R.view}</dd>
      </dl>
    </div>
  </article>`;
}

function RoleResult({ s, set }) {
  const scores = computeScores(s.answers);
  const tops = topRoles(scores);
  const tie = tops.length > 1;
  return html`<section class="screen">
    <div class="headrow"><${Icon} name="people" /><div><p class="eyebrow">2단계 · 나의 역할</p>
      <${Title}>${tie ? "당신은 복합 시민입니다" : "당신의 시작 역할은 " + ROLES[tops[0]].name + "입니다"}<//></div></div>
    ${tie
      ? html`<p class="lede">${tops.map(k => ROLES[k].name).join(", ")}의 응답 수가 같습니다. 여러 가치를 함께 살피는 관점입니다. 이번 시민회의를 어떤 역할로 시작할지 직접 골라 주세요.</p>
        <fieldset class="options tie-pick">
          <legend>나의 시작 역할 고르기</legend>
          ${tops.map(k => html`<label class=${"opt role role-" + k} key=${k}>
            <input type="radio" id=${"tie-" + k} name="tie" checked=${s.chosenRole === k} onChange=${() => set({ chosenRole: k })} />
            <span class="key" aria-hidden="true">✓</span>
            <span class="txt"><b>${ROLES[k].name}</b> — ${ROLES[k].q}</span>
          </label>`)}
        </fieldset>
        ${s.chosenRole ? html`<div class="reveal" key=${s.chosenRole}><${RoleCard} role=${s.chosenRole} /></div>` : null}`
      : html`<${RoleCard} role=${tops[0]} />`}
    <div>
      <p class="small muted" style=${{ marginBottom: "10px" }}>응답 분포 (9문항 중 고른 수)</p>
      <div class="scores">
        ${ROLE_KEYS.map(k => html`<div class=${"score role role-" + k} key=${k}>
          <div class="n">${scores[k]}</div><div class="l">${ROLES[k].name}</div>
          <div class="dots" aria-hidden="true">${Array.from({ length: 9 }, (_, j) => html`<i key=${j} class=${j < scores[k] ? "on" : ""}></i>`)}</div>
        </div>`)}
      </div>
    </div>
    <p class="note">세 역할 사이에 더 낫거나 못한 것은 없습니다. 각 역할은 같은 문제를 다른 질문으로 바라보는 출발점입니다.</p>
    <div class="actions">
      <button class="btn ghost" onClick=${() => set({ stage: "survey", qIndex: 8 })}>설문으로 돌아가기</button>
      <button class="btn" disabled=${!s.chosenRole} onClick=${() => set({ stage: "vote" })}>시민회의에 참여하기</button>
    </div>
  </section>`;
}

function Vote({ s, set }) {
  const idx = INITIAL_OPTS.findIndex(o => o.id === s.initialOpinion);
  return html`<section class="screen">
    <div class="headrow"><${Icon} name="bubble" /><div><p class="eyebrow">3단계 · 시작 의견 투표</p><${Title}>지금, 중앙대학교의 빈 강의실을 어떻게 활용하고 싶나요?<//></div></div>
    <p class="muted">지금 떠오르는 생각을 그대로 골라 주세요. 시민회의를 마친 뒤 다시 한번 묻습니다.</p>
    <${Options} name="initial" items=${INITIAL_OPTS.map(o => o.label)} keys=${["1", "2", "3", "4"]} value=${idx < 0 ? null : idx} onChange=${(i) => set({ initialOpinion: INITIAL_OPTS[i].id })} />
    <div class="actions">
      <button class="btn ghost" onClick=${() => set({ stage: "role" })}>역할 다시 보기</button>
      <button class="btn" disabled=${!s.initialOpinion} onClick=${() => set({ stage: "meeting", scene: 0 })}>시민회의 시작하기</button>
    </div>
  </section>`;
}

function Summary({ s }) {
  return html`<div class=${"summary role role-" + s.chosenRole}>
    <span><span class="muted">나의 역할</span> <${RoleChip} role=${s.chosenRole} /></span>
    <span><span class="muted">시작 의견</span> <b>${labelOf(INITIAL_OPTS, s.initialOpinion)}</b></span>
  </div>`;
}

function Meeting({ s, set }) {
  const n = s.scene, S = SCENES[n], choice = s.sceneChoices[n], role = s.chosenRole;
  const choose = (i) => { const c = s.sceneChoices.slice(); c[n] = i; set({ sceneChoices: c }); };
  const next = () => { if (n < 3) set({ scene: n + 1 }); else set({ stage: "proposal" }); };
  return html`<section class="screen" key=${"scene" + n}>
    <${Summary} s=${s} />
    <div class="headrow"><${Icon} name=${S.icon} /><div><p class="eyebrow">4단계 · 시민회의 · 장면 ${n + 1} / 4</p><${Title}>${S.title}<//></div></div>

    <div class="block">
      <div class="blabel">다큐 나레이션</div>
      <p class="narr">${S.narr}</p>
    </div>

    <div class="block">
      <div class="blabel">누군가의 목소리</div>
      <div class="voices">
        ${S.voices.map((v, k) => html`<div class="voice" key=${k}><${Icon} name="bubble" />
          <blockquote><p>“${v.t}”</p><cite>— ${v.who}</cite></blockquote></div>`)}
      </div>
      <p class=${"lens role role-" + role}><b>${ROLES[role].name}의 질문</b> · ${S.lens[role]}</p>
    </div>

    ${n === 3 ? html`<div class="block">
      <div class="blabel">지금까지 나의 기록</div>
      <ul class="path">
        <li><span>시작 의견</span><span><b>${labelOf(INITIAL_OPTS, s.initialOpinion)}</b></span></li>
        ${[0, 1, 2].map(k => html`<li key=${k}><span>장면 ${k + 1}</span><span>${SCENES[k].o[s.sceneChoices[k]] || "—"}</span></li>`)}
      </ul>
    </div>` : null}

    <div class="block">
      <div class="blabel">당신의 선택</div>
      <${Options} name=${"scene" + n} legend=${S.q} items=${S.o} value=${choice} onChange=${choose} />
    </div>

    <div aria-live="polite">
      ${choice !== null ? html`<div class="block reveal" key=${"fb" + n + "-" + choice}>
        <div class="feedback">
          <div class="card val"><h3>이 선택이 살핀 가치</h3><p>${S.fb[choice].v}</p></div>
          <div class="card que"><h3>아직 남은 질문</h3><p>${S.fb[choice].r}</p></div>
        </div>
        ${n === 3 && choice === 0 ? html`<p class="small muted">유지한 처음 의견: <b>${labelOf(INITIAL_OPTS, s.initialOpinion)}</b></p>` : null}
        <p class="common">${S.common}</p>
      </div>` : null}
    </div>

    <div class="actions">
      <button class="btn ghost" onClick=${() => n > 0 ? set({ scene: n - 1 }) : set({ stage: "vote" })}>이전으로</button>
      <button class="btn" disabled=${choice === null} onClick=${next}>${n < 3 ? "다음 목소리 듣기" : "최종 제안 쓰기"}</button>
    </div>
  </section>`;
}

const FIELDS = [
  { k: "a", label: "우리 팀의 최종 제안", ph: "예: 평일 낮에는 자습·휴식 공간, 주 1회 저녁에는 지역 문화 프로그램으로 운영" },
  { k: "b", label: "우리가 가장 중요하게 본 목소리", ph: "예: 휴게공간 부족으로 가장 큰 스트레스를 겪는 학생들" },
  { k: "c", label: "처음 생각과 달라진 점", ph: "예: 처음에는 자습실만 생각했지만, 쉬는 공간의 필요도 알게 되었다" },
  { k: "d", label: "이 결정에서 반드시 보호해야 할 사람", ph: "예: 시험기간에 갈 곳이 없는 통학생" }
];
function ProposalDoc({ s }) {
  return html`<article class="doc" aria-label="시민회의 제안서">
    <header class="doc-head">
      <h3>시민회의 제안서</h3>
      <p class="meta">안건 · 중앙대학교 캠퍼스의 남는 강의실 활용</p>
    </header>
    <dl>
      ${FIELDS.map(f => html`<div key=${f.k}><dt>${f.label}</dt>
        <dd class=${s.proposal[f.k].trim() ? "" : "empty"}>${s.proposal[f.k].trim() || "아직 작성하지 않았습니다."}</dd></div>`)}
    </dl>
    <footer class="doc-foot">
      <span>작성자 역할 · ${ROLES[s.chosenRole] ? ROLES[s.chosenRole].name : "—"}</span>
      <span>시작 의견 · ${labelOf(INITIAL_OPTS, s.initialOpinion)}</span>
    </footer>
  </article>`;
}
function Proposal({ s, set }) {
  const upd = (k, v) => set({ proposal: Object.assign({}, s.proposal, { [k]: v }) });
  return html`<section class="screen">
    <div class="headrow"><${Icon} name="pen" /><div><p class="eyebrow">5단계 · 최종 제안</p><${Title}>우리 팀의 제안을 정리해 봅시다<//></div></div>
    <p class="muted">네 칸을 채우면 아래 제안서에 바로 정리됩니다. 비워 둔 칸이 있어도 다음으로 넘어갈 수 있습니다.</p>
    <div class="block">
      ${FIELDS.map((f, i) => html`<div class="field" key=${f.k}>
        <label for=${"p-" + f.k}>${i + 1}. ${f.label}</label>
        <textarea id=${"p-" + f.k} value=${s.proposal[f.k]} placeholder=${f.ph} onChange=${e => upd(f.k, e.target.value)}></textarea>
      </div>`)}
    </div>
    <${ProposalDoc} s=${s} />
    <div class="actions">
      <button class="btn ghost" onClick=${() => set({ stage: "meeting", scene: 3 })}>시민회의로 돌아가기</button>
      <button class="btn" onClick=${() => set({ stage: "finalVote" })}>최종 의견 투표하기</button>
    </div>
  </section>`;
}

function FinalVote({ s, set }) {
  const idx = FINAL_OPTS.findIndex(o => o.id === s.finalOpinion);
  return html`<section class="screen">
    <div class="headrow"><${Icon} name="bubble" /><div><p class="eyebrow">6단계 · 돌아보기</p><${Title}>이제 당신은 중앙대학교의 빈 강의실을 어떻게 활용하고 싶나요?<//></div></div>
    <${Options} name="final" items=${FINAL_OPTS.map(o => o.label)} keys=${["1", "2", "3", "4", "5"]} value=${idx < 0 ? null : idx} onChange=${(i) => set({ finalOpinion: FINAL_OPTS[i].id })} />
    <div class="actions">
      <button class="btn ghost" onClick=${() => set({ stage: "proposal" })}>제안서로 돌아가기</button>
      <button class="btn" disabled=${!s.finalOpinion} onClick=${() => set({ stage: "reflect" })}>돌아보기 결과 보기</button>
    </div>
  </section>`;
}

function Reflect({ s, restart }) {
  const same = s.initialOpinion === s.finalOpinion || (s.initialOpinion === "undecided" && s.finalOpinion === "discuss");
  return html`<section class="screen">
    <div class="headrow"><${Icon} name="loop" /><div><p class="eyebrow">6단계 · 돌아보기</p><${Title}>나의 생각은 어떻게 움직였을까요?<//></div></div>
    <div class="compare">
      <div class="card"><div class="k">처음 의견</div><div class="v">${labelOf(INITIAL_OPTS, s.initialOpinion)}</div></div>
      <div class="arr" aria-hidden="true">→</div>
      <div class="card"><div class="k">최종 의견</div><div class="v">${labelOf(FINAL_OPTS, s.finalOpinion)}</div></div>
    </div>
    <p class="verdict">${same ? "처음의 관점을 유지했지만, 다른 입장을 검토하는 과정을 거쳤습니다." : "새로운 목소리와 정보를 만나며 관점이 확장되었습니다."}</p>

    <div class="card block">
      <div class="blabel">시민회의에서 내가 살핀 가치</div>
      <p class="small"><span class="muted">시작 역할</span> <${RoleChip} role=${s.chosenRole} /></p>
      <ul class="path">
        ${SCENES.map((S, k) => html`<li key=${k}><span>${S.title}</span><span>${s.sceneChoices[k] !== null ? S.fb[s.sceneChoices[k]].v : "—"}</span></li>`)}
      </ul>
    </div>

    <${ProposalDoc} s=${s} />

    <div class="card">
      <div class="blabel" style=${{ marginBottom: "6px" }}>보이텔스바흐 원칙으로 돌아보기</div>
      <div class="principles">
        <div class="principle"><h3>강제성 금지</h3><p>특정 선택을 해야 좋은 시민이라고 말하지 않았습니다.</p></div>
        <div class="principle"><h3>논쟁성 보장</h3><p>자습실, 휴게공간, 지역 개방의 장단점을 함께 다뤘습니다.</p></div>
        <div class="principle"><h3>학습자 이해관계 반영</h3><p>각자는 자신의 생활과 가치관을 바탕으로 판단하고, 새로운 정보에 따라 의견을 조정할 수 있었습니다.</p></div>
      </div>
    </div>

    <p class="closing">시민참여교육은 무엇을 믿으라고 가르치는 일이 아니라, 무엇을 질문하고 누구의 목소리를 들을지 함께 배우는 과정입니다.</p>
    <div class="actions" style=${{ justifyContent: "center" }}><button class="btn big" onClick=${restart}>처음부터 다시 참여하기</button></div>
  </section>`;
}

/* =================== 앱 =================== */
function App() {
  const [s, setS] = useState(load);
  const presenter = useMemo(isPresenter, []);
  const first = useRef(true);
  const set = (patch) => setS(prev => Object.assign({}, prev, patch));

  useEffect(() => { try { sessionStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }, [s]);
  useEffect(() => {
    if (first.current) { first.current = false; return; }
    window.scrollTo({ top: 0, behavior: "auto" });
    const t = document.getElementById("screen-title");
    if (t) t.focus({ preventScroll: true });
  }, [s.stage, s.qIndex, s.scene]);

  const restart = () => { try { sessionStorage.removeItem(KEY); } catch (e) {} setS(fresh()); };
  const step = STAGE_STEP[s.stage];
  const noteId = s.stage === "meeting" ? "scene" + s.scene : s.stage;

  let screen;
  switch (s.stage) {
    case "survey": screen = html`<${Survey} s=${s} set=${set} />`; break;
    case "role": screen = html`<${RoleResult} s=${s} set=${set} />`; break;
    case "vote": screen = html`<${Vote} s=${s} set=${set} />`; break;
    case "meeting": screen = html`<${Meeting} s=${s} set=${set} />`; break;
    case "proposal": screen = html`<${Proposal} s=${s} set=${set} />`; break;
    case "finalVote": screen = html`<${FinalVote} s=${s} set=${set} />`; break;
    case "reflect": screen = html`<${Reflect} s=${s} restart=${restart} />`; break;
    default: screen = html`<${Intro} go=${() => set({ stage: "survey", qIndex: 0 })} />`;
  }

  return html`<div>
    <header class="top">
      <div class="top-inner">
        <div class="brand">
          <span class="brand-name">빈 강의실의 세 가지 목소리</span>
          ${presenter ? html`<span class="badge">발표 모드</span>` : null}
        </div>
        <ol class="steps" aria-label="진행 단계">
          ${STEP_LABELS.map((l, i) => html`<li key=${i} class=${i < step ? "done" : i === step ? "now" : ""} aria-current=${i === step ? "step" : undefined}>
            <div class="bar"></div><span class="lbl">${l}</span></li>`)}
        </ol>
      </div>
    </header>
    <main class="wrap" key=${s.stage}>
      ${screen}
      <${PresenterNote} id=${noteId} on=${presenter} key=${noteId} />
    </main>
  </div>`;
}

ReactDOM.createRoot(document.getElementById("root")).render(html`<${App} />`);
})();
</script>
</body>
</html>
